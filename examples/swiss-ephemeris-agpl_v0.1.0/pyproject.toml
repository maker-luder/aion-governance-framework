[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-swiss-ephemeris-agpl"
version = "0.2.0"
description = "Optional AGPL-3.0-only, pinned offline Swiss Ephemeris position provider"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "UPSTREAM_NOTICE.txt"]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
research-bridge = ["aion-astra-classical-astrology==0.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
aion_swiss_ephemeris = ["lock.json", "leap-seconds.list"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../classical-western-astrology_v0.1.0/src"]
