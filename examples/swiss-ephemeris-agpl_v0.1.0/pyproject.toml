[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-swiss-ephemeris-agpl"
version = "0.1.0"
description = "Optional AGPL-3.0-only, pinned offline Swiss Ephemeris position provider"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "UPSTREAM_NOTICE.txt"]
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aion_swiss_ephemeris = ["lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
