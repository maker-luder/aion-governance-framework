[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-astra-bazi-core"
version = "0.2.0"
description = "Offline deterministic Bazi engine with auditable traditional calculation extensions"
requires-python = ">=3.11"
dependencies = ["lunar_python==1.4.8", "tzdata==2026.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aion_astra_bazi_core = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["aion_astra_bazi_core"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["aion_astra_bazi_core"]
exclude = ["^build/", "^src/aion_astra_bazi_core\\.egg-info/"]
