target-version = "py311"
line-length = 120
extend-exclude = [
  ".venv",
  "qa/historical",
]

[lint]
# Keep the frozen archive's first lint gate focused on correctness. Broader
# formatting and modernization rules can be evaluated without rewriting
# historical source material.
select = ["E9", "F"]

[lint.per-file-ignores]
# This transferred execution bundle imports optional heavyweight packages only
# to prove that an approved runtime has them available before stopping at its
# explicit execution gate.
"research-labs/language-core-g1_v0.2.1/engineering/lora/LORA_EXECUTION_BUNDLE/train_lora.py" = ["F401"]
