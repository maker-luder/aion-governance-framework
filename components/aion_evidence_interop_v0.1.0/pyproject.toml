[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-evidence-interop-v0.1.0"
version = "0.1.0"
description = "Inspection-only evidence interoperability exporters for AION"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23", "pytest>=8"]

[project.scripts]
aion-evidence-interop = "aion_evidence_interop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
