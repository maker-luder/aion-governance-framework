[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-engineering-workbench"
version = "1.0.0"
description = "Owner-approved, local-only candidate engineering workbench for Astra"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
astra-workbench = "astra_engineering_workbench.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["astra_engineering_workbench"]
branch = true
omit = [
  "*/interfaces.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["astra_engineering_workbench"]
exclude = ["^build/", "^src/astra_engineering_workbench\\.egg-info/"]
