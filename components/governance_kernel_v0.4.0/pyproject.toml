
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-governance-kernel"
version = "0.4.0"
description = "Sandbox-only structured governance and audit kernel for the AION research project"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
aion-governance-check = "aion_governance_kernel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["aion_governance_kernel"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["aion_governance_kernel"]
exclude = ["^build/", "^src/aion_governance_kernel\\.egg-info/"]
