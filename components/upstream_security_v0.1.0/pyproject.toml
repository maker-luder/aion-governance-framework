[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-astra-upstream-agent-security"
version = "0.1.0"
description = "Offline candidate controls for upstream-agent incidents and trajectory-level execution governance"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aion-astra-agent-security = "aion_astra_agent_security.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["aion_astra_agent_security"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["aion_astra_agent_security"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
