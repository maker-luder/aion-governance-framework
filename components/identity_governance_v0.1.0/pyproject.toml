[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-astra-identity-governance"
version = "0.1.0"
description = "Offline candidate governance for AION/Astra identity, lineage, capabilities, and research forks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aion-astra-governance = "aion_astra_governance.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["aion_astra_governance"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["aion_astra_governance"]
exclude = ["^build/", "^src/aion_astra_identity_governance\\.egg-info/"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
