[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-observation-evidence-mcp"
version = "0.1.0"
description = "Pure-read MCP observation and provenance evidence bridge for AION/Astra"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.0.0",
]

[project.scripts]
aion-observation-evidence-mcp = "aion_mcp_evidence_bridge.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "anyio>=4",
  "jsonschema>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aion_mcp_evidence_bridge = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
