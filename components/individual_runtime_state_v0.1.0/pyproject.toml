[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "individual-runtime-state"
version = "0.1.0"
description = "Governed individual runtime event lineage and recovery candidate"
requires-python = ">=3.11"
dependencies = [
  "aion-astra-executable-runtime==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../executable_runtime_v0.1.0/src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["individual_runtime_state"]
