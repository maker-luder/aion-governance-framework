[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-provenance-visibility-agent"
version = "0.1.0"
description = "Local-first research verifier that makes supported provenance signals visible"
requires-python = ">=3.11"

[project.optional-dependencies]
c2pa = ["c2pa-python==0.38.0"]

[tool.mypy]
strict = true
