[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-provenance-visibility-agent"
version = "0.1.0"
description = "Research candidate that makes supported hidden provenance signals visible"
requires-python = ">=3.11"

[project.optional-dependencies]
openai = ["openai>=2.0.0"]
[tool.mypy]
strict = true
