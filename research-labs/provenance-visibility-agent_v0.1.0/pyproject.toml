[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-provenance-visibility-agent"
version = "0.1.0"
description = "Local-first text provenance visibility and evidence-reveal research tooling"
requires-python = ">=3.11"

[tool.mypy]
strict = true

[tool.setuptools.package-data]
aion_provenance_visibility_agent = ["unicode_tables.json", "UNICODE_LICENSE.txt"]
