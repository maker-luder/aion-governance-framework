[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-provenance-visibility-agent"
version = "0.1.0"
description = "Local-first text provenance visibility and evidence-reveal research tooling"
requires-python = ">=3.11"

[project.scripts]
aion-text-visibility = "aion_provenance_visibility_agent.cli:main"

[tool.mypy]
strict = true
