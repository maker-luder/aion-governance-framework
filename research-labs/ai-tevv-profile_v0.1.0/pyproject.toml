[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-ai-tevv-profile"
version = "0.1.0"
description = "Fail-closed structural profile for bounded AI TEVV planning"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aion_ai_tevv"]
