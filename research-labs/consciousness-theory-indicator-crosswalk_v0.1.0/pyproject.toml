[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-consciousness-theory-indicator-crosswalk"
version = "0.1.0"
description = "Research-only separation of consciousness theories, engineered indicators, evidence, and non-claims"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
