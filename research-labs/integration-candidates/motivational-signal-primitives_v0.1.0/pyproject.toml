[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motivational-signal-primitives"
version = "0.1.0"
description = "Minimal evidence-bound motivational signal primitives salvaged from a rejected candidate"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
