[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-bounded-autonomous-research-loop"
version = "0.1.0"
description = "Bounded autonomous research orchestration reusing AION/Astra inquiry, EGD, Four-Domain, and Evidence Interop"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
