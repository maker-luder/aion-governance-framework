[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-self-report-instrument-validity-calibration"
version = "0.1.0"
description = "Research-only self-report instrument freezing, synthetic calibration, framing sensitivity, and run-manifest validation"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
