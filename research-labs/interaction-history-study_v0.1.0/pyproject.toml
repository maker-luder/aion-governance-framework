[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-interaction-history-study"
version = "0.1.0"
description = "Bounded study records for artifact-mediated branch-selection and multi-run capability hypotheses"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
