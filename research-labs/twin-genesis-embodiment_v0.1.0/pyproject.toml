[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-astra-twin-embodiment"
version = "0.2.0"
description = "Governed research candidate for AION/Astra shared-genesis twin embodiment"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "aion-astra-executable-runtime==0.1.0",
]

[project.scripts]
aion-astra-embodiment = "aion_astra_twin_embodiment.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "../../components/executable_runtime_v0.1.0/src"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aion_astra_twin_embodiment"]
mypy_path = "../../components/governance_kernel_v0.4.0/src:../../components/astra_workbench_v1.0.0/src:../language-core-g1_v0.2.1/src:../../components/memory_recall_governance_v0.1.0/src:../../components/executable_runtime_v0.1.0/src:../../components/individual_runtime_state_v0.1.0/src:../../components/aion_evidence_interop_v0.1.0/src:../../components/agent_execution_substrate_v0.1.0/src:../../components/aion_runtime_v0.1.0/src:../../components/astra_runtime_v0.1.0/src"
