[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-astra-twin-embodiment"
version = "0.1.0"
description = "Governed research candidate for AION/Astra shared-genesis twin embodiment"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "aion-astra-executable-runtime==0.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "../../components/executable_runtime_v0.1.0/src"]
