[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-coupled-cognition-quality-factory"
version = "0.1.0"
description = "Inspection-oriented quality factory for human-AI collaborative inquiry with NCR/CAPA and a mandatory counterevidence lane"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
