[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-csomi-slsh-integration"
version = "0.1.0"
description = "Read-only CSOMI x SLSH interface and consistency module"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.12.9",
  "types-jsonschema==4.26.0.20260518",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
files = ["src", "../../scripts/materialize_csomi_slsh_integration.py", "../../scripts/check_csomi_slsh_integration.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
