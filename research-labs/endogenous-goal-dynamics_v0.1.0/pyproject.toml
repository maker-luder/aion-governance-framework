[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-endogenous-goal-dynamics"
version = "0.1.0"
description = "Bounded Four-Domain research harness for endogenous goal dynamics"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
