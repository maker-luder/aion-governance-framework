[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-shared-origin-divergence"
version = "0.1.0"
description = "Research-only shared-origin divergence and lineage-governance substrate for AION/Astra"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
