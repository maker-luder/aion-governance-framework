[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-history-replay-policy"
version = "0.1.0"
description = "Bounded synthetic evaluation of exploration policies over recorded discovery histories"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aion_history_replay_policy"]
