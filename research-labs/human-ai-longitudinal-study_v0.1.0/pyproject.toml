[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-human-ai-longitudinal-study"
version = "0.1.0"
description = "Bounded experimental records for longitudinal human-AI grounding and task-conditioned epistemic policy studies"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
