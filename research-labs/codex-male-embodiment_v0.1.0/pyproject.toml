[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-male-embodiment"
version = "0.1.0"
description = "Bounded synthetic adult male-form embodiment research candidate for Codex"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["codex_male_embodiment"]
