name: Cross-Language Contract Conformance

on:
  push:
    branches:
      - engineering/**
    paths:
      - "schemas/**"
      - "conformance/**"
      - "components/executable_runtime_v0.1.0/src/**"
      - "components/executable_runtime_v0.1.0/tests/**"
      - "components/individual_runtime_state_v0.1.0/src/**"
      - "components/individual_runtime_state_v0.1.0/tests/**"
      - "docs/AION_CROSS_LANGUAGE_CONTRACT_SURFACE_MAP_V0.1.0.md"
      - "docs/AION_INTEROPERABILITY_PROFILE_V0.1.0.md"
      - "language-spec/**"
      - "docs/AION_NATIVE_LANGUAGE_*.md"
      - "tests/test_aion_native_language_artifacts.py"
      - ".github/workflows/cross-language-contract-conformance.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "conformance/**"
      - "components/executable_runtime_v0.1.0/src/**"
      - "components/executable_runtime_v0.1.0/tests/**"
      - "components/individual_runtime_state_v0.1.0/src/**"
      - "components/individual_runtime_state_v0.1.0/tests/**"
      - "docs/AION_CROSS_LANGUAGE_CONTRACT_SURFACE_MAP_V0.1.0.md"
      - "docs/AION_INTEROPERABILITY_PROFILE_V0.1.0.md"
      - "language-spec/**"
      - "docs/AION_NATIVE_LANGUAGE_*.md"
      - "tests/test_aion_native_language_artifacts.py"
      - ".github/workflows/cross-language-contract-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-conformance:
    name: Contract vectors / Python reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install contract-validation toolchain
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Validate AION native-language feasibility artifacts
        run: python -m pytest -q tests/test_aion_native_language_artifacts.py

      - name: Run reusable contract vectors
        env:
          PYTHONPATH: "${{ github.workspace }}/components/executable_runtime_v0.1.0/src:${{ github.workspace }}/components/governance_kernel_v0.4.0/src:${{ github.workspace }}/components/language_core_v0.1.0/src:${{ github.workspace }}/components/memory_recall_governance_v0.1.0/src:${{ github.workspace }}/components/individual_runtime_state_v0.1.0/src:${{ github.workspace }}/components/astra_workbench_v1.0.0/src"
        run: |
          python -m pytest -q \
            components/executable_runtime_v0.1.0/tests/test_context_conformance.py \
            components/executable_runtime_v0.1.0/tests/test_interoperability_primitives.py \
            components/individual_runtime_state_v0.1.0/tests/test_lifecycle_conformance.py
