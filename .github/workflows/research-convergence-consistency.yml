name: Research Consolidation Consistency

on:
  push:
    branches:
      - review/four-domain-research-materialization
    paths:
      - "docs/research-consolidation/**"
      - "research-workbench/four-domain-materialization/2026-08-14/**"
      - "research-labs/four-domain-p2-materialization_v0.1.0/**"
      - "research-labs/four-domain-p5-hypothesis-convergence_v0.1.0/**"
      - "schemas/aion_research_consolidation_artifact_v0.1.0.schema.json"
      - "schemas/aion_cross_branch_index_v0.1.0.schema.json"
      - "schemas/aion_public_discoverability_taxonomy_v0.1.0.schema.json"
      - "schemas/aion_change_level_provenance_v0.1.0.schema.json"
      - "schemas/research_evidence_record_v0.2.0.schema.json"
      - "scripts/check_research_consolidation_consistency.py"
      - "scripts/validate_research_evidence.py"
      - "tests/research_consolidation/**"
      - ".github/workflows/research-convergence-consistency.yml"
  pull_request:
    branches:
      - review/four-domain-research-materialization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-convergence-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency-and-slice:
    name: Consolidation consistency and P2 reviewer slice / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation toolchain
        run: python -m pip install --upgrade pip pytest jsonschema setuptools wheel

      - name: Validate consolidation artifacts and boundaries
        run: python scripts/check_research_consolidation_consistency.py

      - name: Validate P2 Packet C slice
        working-directory: research-labs/four-domain-p2-materialization_v0.1.0
        run: |
          python -m compileall -q src
          python -m pytest -q

      - name: Validate P5 hypothesis/falsifier governance substrate
        working-directory: research-labs/four-domain-p5-hypothesis-convergence_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src scripts
          python -m pytest -q
          python scripts/run_full_demo.py

      - name: Validate existing evidence admission tests
        run: python -m pytest -q tests/test_research_evidence_validator.py tests/research_consolidation
