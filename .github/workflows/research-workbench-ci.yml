name: Research Workbench CI

on:
  push:
    branches:
      - review/four-domain-research-materialization
    paths:
      - "research-labs/external-evidence-normalization_v0.1.0/**"
      - "research-labs/embodiment-continuity-anchor_v0.1.0/**"
      - "research-labs/causal-internal-state_v0.1.0/**"
      - "research-labs/triangulated-subjectivity-evidence_v0.1.0/**"
      - "research-labs/consciousness-theory-indicator-crosswalk_v0.1.0/**"
      - "research-labs/self-report-false-positive-challenge_v0.1.0/**"
      - "research-labs/self-report-instrument-validity-calibration_v0.1.0/**"
      - "research-labs/self-model-functional-ablation_v0.1.0/**"
      - "research-labs/selective-memory-control_v0.1.0/**"
      - "research-labs/research-evaluation-harness_v0.1.0/**"
      - "research-labs/trace-provenance-crosswalk_v0.1.0/**"
      - "research-labs/governed-tool-approval_v0.1.0/**"
      - "research-labs/real-model-pilot-protocol_v0.1.0/**"
      - "research-labs/supervised-control-pilot_v0.1.0/**"
      - "research-labs/external-agent-sandbox-protocol_v0.1.0/**"
      - "research-workbench/four-domain-materialization/2026-08-10/EXTERNAL_CONSCIOUSNESS_PROJECTS_INTAKE.md"
      - "research-workbench/four-domain-materialization/2026-08-10/EXTERNAL_AGENT_SANDBOX_PROTOCOL_STATUS.md"
      - "research-workbench/four-domain-materialization/2026-08-11/EXTERNAL_MODULE_INTAKE_PYDANTIC_EVALS_2026-08-11.md"
      - "research-workbench/four-domain-materialization/2026-08-11/EXTERNAL_MODULE_INTAKE_OPENINFERENCE_2026-08-11.md"
      - "research-workbench/four-domain-materialization/2026-08-11/EXTERNAL_MODULE_INTAKE_INSPECT_AI_2026-08-11.md"
      - "research-workbench/four-domain-materialization/2026-08-11/EXTERNAL_MODULE_TRANSFORMATION_STATUS_2026-08-11.md"
      - ".github/workflows/research-workbench-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-workbench-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-research-labs:
    name: Focused research labs / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test toolchain
        run: python -m pip install --upgrade pip pytest setuptools wheel

      - name: Verify external evidence normalization lab
        working-directory: research-labs/external-evidence-normalization_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q

      - name: Verify embodiment continuity anchor lab
        working-directory: research-labs/embodiment-continuity-anchor_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q

      - name: Verify causal internal state lab
        working-directory: research-labs/causal-internal-state_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q

      - name: Verify triangulated subjectivity evidence lab
        working-directory: research-labs/triangulated-subjectivity-evidence_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q

      - name: Verify consciousness theory indicator crosswalk
        working-directory: research-labs/consciousness-theory-indicator-crosswalk_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q

      - name: Verify self-report false-positive challenge
        working-directory: research-labs/self-report-false-positive-challenge_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q

      - name: Verify self-report instrument calibration
        working-directory: research-labs/self-report-instrument-validity-calibration_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q

      - name: Verify self-model functional ablation model
        working-directory: research-labs/self-model-functional-ablation_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q
          python scripts/run_demo.py

      - name: Verify selective memory control model
        working-directory: research-labs/selective-memory-control_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q
          python scripts/run_demo.py

      - name: Verify research evaluation harness
        working-directory: research-labs/research-evaluation-harness_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q
          python scripts/run_demo.py

      - name: Verify trace provenance crosswalk
        working-directory: research-labs/trace-provenance-crosswalk_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q
          python scripts/run_demo.py

      - name: Verify governed tool approval
        working-directory: research-labs/governed-tool-approval_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q
          python scripts/run_demo.py

      - name: Verify real-model pilot protocol
        working-directory: research-labs/real-model-pilot-protocol_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q

      - name: Verify supervised control pilot preparation
        working-directory: research-labs/supervised-control-pilot_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q

      - name: Verify external-agent sandbox protocol
        working-directory: research-labs/external-agent-sandbox-protocol_v0.1.0
        run: |
          python -m pip install -e .
          python -m compileall -q src
          python -m pytest -q
