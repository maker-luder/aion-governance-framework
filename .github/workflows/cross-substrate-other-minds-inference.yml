name: Cross-Substrate Other-Minds Inference

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csomi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csomi-consistency:
    # Historical research workflow preserved for provenance only. The project
    # work loop was terminated on 2026-08-20, so execution is fail-closed.
    if: ${{ false }}
    name: CSOMI schema, matrices, controls and vertical slice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation toolchain
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Validate CSOMI packet and boundaries
        run: python scripts/check_csomi_consistency.py

      - name: Rebuild reviewer-facing artifacts
        run: python scripts/build_csomi_artifacts.py

      - name: Run CSOMI contract tests
        run: python -m pytest -q research-labs/cross-substrate-other-minds-inference_v0.1.0/tests

      - name: Compile validation scripts
        run: python -m compileall -q scripts/check_csomi_consistency.py scripts/build_csomi_artifacts.py

      - name: Run existing research-only P2/P5 test surfaces
        run: |
          python -m pytest -q research-labs/four-domain-p2-materialization_v0.1.0/tests
          python -m pytest -q research-labs/four-domain-p5-hypothesis-convergence_v0.1.0/tests

      - name: Verify no runtime/canonical boundary drift
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          packet = json.loads(Path("research-workbench/cross-substrate-other-minds-inference-2026-08-14/CSOMI_PACKET_V0.1.0.json").read_text())
          fixture = json.loads(Path("research-labs/cross-substrate-other-minds-inference_v0.1.0/fixtures/csomi_positive_negative_controls_v0.1.0.json").read_text())
          assert packet["canonical_effect"] == "NONE"
          assert packet["deployment"] is False
          assert packet["subjectivity_conclusion"] == "NOT_ESTABLISHED"
          assert fixture["runtime_integration"] == "NONE"
          assert fixture["model_calls"] == "NONE"
          PY
