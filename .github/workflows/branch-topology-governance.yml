name: Branch Topology Governance

on:
  create:
  delete:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate four-branch topology
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Enforce durable and transient branch limits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/validate_branch_topology.py
          --policy .github/branch-topology-policy.json
          --repository "${{ github.repository }}"

  cleanup-closed-pr-head:
    name: Remove closed transient PR branch
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout canonical cleanup guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Delete only the unchanged non-durable head and revalidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/validate_branch_topology.py
          --policy .github/branch-topology-policy.json
          --repository "${{ github.repository }}"
          --delete-closed-pr-head "${{ github.event.pull_request.head.ref }}"
          --expected-head "${{ github.event.pull_request.head.sha }}"
