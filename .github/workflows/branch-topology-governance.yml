name: Branch Topology Governance

on:
  delete:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate four-branch topology
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Enforce durable and transient branch policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/validate_branch_topology.py
          --policy .github/branch-topology-policy.json
          --repository "${{ github.repository }}"

  assess-closed-pr-retirement:
    name: Assess closed PR retirement (advisory HOLD)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout canonical retirement guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Assess preservation without granting deletion authority
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETIREMENT_REPOSITORY: ${{ github.repository }}
          RETIREMENT_PR: ${{ github.event.pull_request.number }}
          RETIREMENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          RETIREMENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/validate_branch_topology.py
          --policy .github/branch-topology-policy.json
          --repository "$RETIREMENT_REPOSITORY"
          --assess-closed-pr "$RETIREMENT_PR"
          --branch "$RETIREMENT_BRANCH"
          --expected-head "$RETIREMENT_HEAD"
      - name: Read back final topology without destructive repair
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETIREMENT_REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/validate_branch_topology.py
          --policy .github/branch-topology-policy.json
          --repository "$RETIREMENT_REPOSITORY"
