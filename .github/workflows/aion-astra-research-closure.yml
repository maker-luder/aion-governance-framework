name: AION Astra Research Closure

on:
  pull_request:
    paths:
      - "components/aion_astra_inquiry_v0.1.0/**"
      - ".github/workflows/aion-astra-research-closure.yml"
  push:
    branches:
      - main
    paths:
      - "components/aion_astra_inquiry_v0.1.0/**"
      - "research-labs/**"
      - "docs/**"
      - ".github/workflows/aion-astra-research-closure.yml"
  workflow_dispatch:
    inputs:
      external_web:
        description: "Enable governed external web evidence"
        required: false
        default: true
        type: boolean
      max_cycles:
        description: "Maximum research closure cycles"
        required: false
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  tests:
    name: Research closure tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run inquiry component tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=components/aion_astra_inquiry_v0.1.0/src \
            python -m pytest -q \
            components/aion_astra_inquiry_v0.1.0/tests \
            -o addopts=

      - name: Verify repository stayed read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"

  bounded-research-closure:
    name: Bounded autonomous research closure
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run closure
        id: closure
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EXTERNAL_WEB: ${{ inputs.external_web }}
          INPUT_MAX_CYCLES: ${{ inputs.max_cycles }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/aion-astra-research-closure"
          mkdir -p "${output}"

          max_cycles="${INPUT_MAX_CYCLES:-2}"
          external_args=()

          if [[ "${EVENT_NAME}" == "push" ]]; then
            external_args+=(--external-web)
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${INPUT_EXTERNAL_WEB:-true}" == "true" ]]; then
            external_args+=(--external-web)
          fi

          PYTHONPATH=components/aion_astra_inquiry_v0.1.0/src \
            python -m aion_astra_inquiry.research_cli \
              --root . \
              --repository-ref "${GITHUB_SHA}" \
              --max-cycles "${max_cycles}" \
              --max-questions-per-cycle 2 \
              --max-rounds 3 \
              --evidence-limit 4 \
              --external-max-queries 12 \
              --external-results-per-query 1 \
              --output "${output}" \
              "${external_args[@]}" \
              | tee "${output}/stdout.txt"

          echo "markdown=${output}/research_campaign.md" >> "${GITHUB_OUTPUT}"

      - name: Publish report to job summary
        shell: bash
        run: |
          set -euo pipefail
          cat "${{ steps.closure.outputs.markdown }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify repository stayed read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
