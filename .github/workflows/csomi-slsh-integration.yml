name: CSOMI SLSH Read-Only Integration

on:
  push:
    branches:
      - integration/csomi-slsh-semantic-reconciliation-20260814
    paths:
      - "schemas/aion_csomi_slsh_integration_v0.1.0.schema.json"
      - "research-labs/csomi-slsh-integration_v0.1.0/**"
      - "research-workbench/csomi-slsh-integration-2026-08-14/**"
      - "scripts/materialize_csomi_slsh_integration.py"
      - "scripts/check_csomi_slsh_integration.py"
      - ".github/workflows/csomi-slsh-integration.yml"
  pull_request:
    branches:
      - integration/csomi-slsh-semantic-reconciliation-20260814
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csomi-slsh-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-module:
    name: Read-only CSOMI x SLSH integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install integration test toolchain
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Fetch frozen SLSH authority as read-only remote-tracking object
        run: |
          git fetch --no-tags origin refs/heads/frozen/slsh-semantic-reconciliation-20260814:refs/remotes/origin/frozen/slsh-semantic-reconciliation-20260814
          test "$(git rev-parse refs/remotes/origin/frozen/slsh-semantic-reconciliation-20260814^{commit})" = "893d8dc0c1c9d8f9a4188860520143c8d1d3977b"
          test "$(git cat-file -t 87405c1877c6f016c303971da13923a1ab690aae)" = commit

      - name: Verify protected and frozen refs remain pinned
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "e079fb7dfe7a04be7dcb94b8a059951a003caa94"
          test "$(git ls-remote origin refs/heads/research/cross-substrate-other-minds-inference-20260814 | cut -f1)" = "87405c1877c6f016c303971da13923a1ab690aae"
          test "$(git ls-remote origin refs/heads/frozen/slsh-semantic-reconciliation-20260814 | cut -f1)" = "893d8dc0c1c9d8f9a4188860520143c8d1d3977b"
          test "$(git ls-remote origin refs/heads/promotion/csomi-selective-canonical-20260814 | cut -f1)" = "7c48c0de87514088c3fd1410218ae92231be0887"

      - name: Materialize deterministic integration record
        run: python scripts/materialize_csomi_slsh_integration.py

      - name: Validate schema, authority lineage and boundaries
        run: python scripts/check_csomi_slsh_integration.py

      - name: Run integration regression and negative tests
        run: PYTHONPATH=research-labs/csomi-slsh-integration_v0.1.0/src python -m pytest -q research-labs/csomi-slsh-integration_v0.1.0/tests

      - name: Compile and parse strict artifacts
        run: |
          python -m compileall -q research-labs/csomi-slsh-integration_v0.1.0/src scripts/materialize_csomi_slsh_integration.py scripts/check_csomi_slsh_integration.py
          python -m json.tool schemas/aion_csomi_slsh_integration_v0.1.0.schema.json >/dev/null
          python -m json.tool research-workbench/csomi-slsh-integration-2026-08-14/CSOMI_SLSH_INTEGRATION_RECORD_V0.1.0.json >/dev/null

      - name: Enforce deterministic clean diff
        run: |
          git diff --check
          git diff --exit-code

      - name: Enforce no experiment runtime model or canonical writeback
        run: |
          PYTHONPATH=research-labs/csomi-slsh-integration_v0.1.0/src python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("research-workbench/csomi-slsh-integration-2026-08-14/CSOMI_SLSH_INTEGRATION_RECORD_V0.1.0.json").read_text())
          assert p["canonical_effect"] == "NONE"
          assert p["deployment"] is False
          assert p["experiment_executed"] is False
          assert p["runtime_executed"] is False
          assert p["model_modified"] is False
          assert p["live_data_collected"] is False
          assert p["subjectivity_conclusion"] == "NOT_ESTABLISHED"
          assert p["provenance_contract"]["provenance_mutation"] == "PROHIBITED"
          assert p["control_falsifier_contract"]["cross_framework_execution"] == "NO_EXPERIMENT_NO_RUNTIME_NO_LIVE_DATA"
          PY
