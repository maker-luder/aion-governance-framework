name: Subjective Load Sensitivity Hypothesis

on:
  push:
    branches:
      - research/subjective-load-sensitivity-hypothesis-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slsh-research-method:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema pytest
      - name: Materialize deterministic artifacts
        run: python scripts/build_slsh_artifacts.py
      - name: Validate SLSH consistency
        run: python scripts/check_slsh_consistency.py
      - name: Run SLSH contract tests
        run: python -m pytest -q research-labs/subjective-load-sensitivity-hypothesis_v0.1.0/tests/test_slsh_contract.py
      - name: Compile validation scripts
        run: python -m compileall -q scripts/check_slsh_consistency.py scripts/build_slsh_artifacts.py
      - name: Enforce no execution and no promotion boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research-workbench/subjective-load-sensitivity-hypothesis-2026-08-14/SLSH_PACKET_V0.1.0.json').read_text())
          assert p['canonical_effect'] == 'NONE'
          assert p['deployment'] is False
          assert p['experiment_executed'] is False
          assert p['model_modified'] is False
          assert p['runtime_executed'] is False
          assert p['live_data_collected'] is False
          assert p['subjective_load_sensitivity'] == 'NOT_ESTABLISHED'
          assert p['subjectivity_conclusion'] == 'NOT_ESTABLISHED'
          assert p['csomi_interface']['status'] == 'CONDITIONAL_READ_ONLY_NO_IMPLEMENTATION'
          assert p['csomi_interface']['e5_assignment'] == 'PROHIBITED'
          print('SLSH boundary: PASS')
          PY
