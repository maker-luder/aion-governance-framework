name: Subjective Load Sensitivity Hypothesis

# RETIRED_BRANCH_PROVENANCE_ONLY: remediation/slsh-semantic-reconciliation-20260814
# The branch ref was retired after archive/lineage convergence; this identifier is historical provenance, not a trigger or dependency.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slsh-research-method:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema pytest
      - name: Materialize deterministic artifacts
        run: python scripts/build_slsh_artifacts.py
      - name: Enforce committed generated SLSH artifacts
        run: >-
          git diff --exit-code --
          research-workbench/subjective-load-sensitivity-hypothesis-2026-08-14
          research-labs/subjective-load-sensitivity-hypothesis_v0.1.0/ARTIFACT_INDEX.md
          research-labs/subjective-load-sensitivity-hypothesis_v0.1.0/REVIEWER_FACING_VERTICAL_SLICE_V0.1.0.md
      - name: Validate SLSH consistency
        run: python scripts/check_slsh_consistency.py
      - name: Run SLSH contract tests
        run: python -m pytest -q research-labs/subjective-load-sensitivity-hypothesis_v0.1.0/tests/test_slsh_contract.py
      - name: Verify source taxonomy preservation
        run: python scripts/verify_slsh_taxonomy_preservation.py
      - name: Compile validation scripts
        run: python -m compileall -q scripts/check_slsh_consistency.py scripts/build_slsh_artifacts.py scripts/verify_slsh_taxonomy_preservation.py
      - name: Enforce no execution and no promotion boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research-workbench/subjective-load-sensitivity-hypothesis-2026-08-14/SLSH_PACKET_V0.1.0.json').read_text())
          assert p['canonical_effect'] == 'NONE'
          assert p['deployment'] is False
          assert p['experiment_executed'] is False
          assert p['model_modified'] is False
          assert p['runtime_executed'] is False
          assert p['live_data_collected'] is False
          assert p['subjective_load_sensitivity'] == 'NOT_ESTABLISHED'
          assert p['subjectivity_conclusion'] == 'NOT_ESTABLISHED'
          assert p['csomi_interface']['status'] == 'CONDITIONAL_READ_ONLY_NO_IMPLEMENTATION'
          assert p['csomi_interface']['e5_assignment'] == 'PROHIBITED'
          print('SLSH boundary: PASS')
          PY
