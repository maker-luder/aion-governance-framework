name: One-time archive and retire final five support branches

on:
  push:
    branches:
      - review/four-domain-research-materialization
    paths:
      - ".github/workflows/one-time-archive-five-branches.yml"

permissions:
  contents: write

jobs:
  archive-and-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current research closure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Preflight exact refs, create archive tags, then retire branches
        shell: bash
        run: |
          set -euo pipefail

          check_head() {
            local ref="$1"
            local expected="$2"
            local actual
            actual="$(git ls-remote origin "refs/heads/${ref}" | cut -f1)"
            test "$actual" = "$expected"
          }

          check_absent_tag() {
            local tag="$1"
            test -z "$(git ls-remote origin "refs/tags/${tag}")"
          }

          check_head "main" "748d7c935c045c5fe92a22d372b93151a9a5e6ef"
          check_head "review/four-domain-research-materialization" "$GITHUB_SHA"
          check_head "engineering/aion-native-language-feasibility-20260814" "3dfc21463502e1c32189ae167d92f163ca1a55e8"
          check_head "research/cross-substrate-other-minds-inference-20260814" "87405c1877c6f016c303971da13923a1ab690aae"
          check_head "frozen/slsh-semantic-reconciliation-20260814" "893d8dc0c1c9d8f9a4188860520143c8d1d3977b"
          check_head "promotion/csomi-selective-canonical-20260814" "7c48c0de87514088c3fd1410218ae92231be0887"
          check_head "promotion/csomi-slsh-integration-selective-20260815" "ce0fa4899a9498d7795d4da9b5f96ba3570c3ead"

          check_absent_tag "archive/engineering-native-language-feasibility-20260814"
          check_absent_tag "archive/research-csomi-source-20260814"
          check_absent_tag "archive/research-slsh-terminal-20260814"
          check_absent_tag "archive/promotion-csomi-selective-canonical-deferred-20260814"
          check_absent_tag "archive/promotion-csomi-slsh-integration-deferred-20260815"

          git fetch --no-tags origin \
            refs/heads/engineering/aion-native-language-feasibility-20260814:refs/remotes/origin/engineering/aion-native-language-feasibility-20260814 \
            refs/heads/research/cross-substrate-other-minds-inference-20260814:refs/remotes/origin/research/cross-substrate-other-minds-inference-20260814 \
            refs/heads/frozen/slsh-semantic-reconciliation-20260814:refs/remotes/origin/frozen/slsh-semantic-reconciliation-20260814 \
            refs/heads/promotion/csomi-selective-canonical-20260814:refs/remotes/origin/promotion/csomi-selective-canonical-20260814 \
            refs/heads/promotion/csomi-slsh-integration-selective-20260815:refs/remotes/origin/promotion/csomi-slsh-integration-selective-20260815

          git tag "archive/engineering-native-language-feasibility-20260814" "3dfc21463502e1c32189ae167d92f163ca1a55e8"
          git tag "archive/research-csomi-source-20260814" "87405c1877c6f016c303971da13923a1ab690aae"
          git tag "archive/research-slsh-terminal-20260814" "893d8dc0c1c9d8f9a4188860520143c8d1d3977b"
          git tag "archive/promotion-csomi-selective-canonical-deferred-20260814" "7c48c0de87514088c3fd1410218ae92231be0887"
          git tag "archive/promotion-csomi-slsh-integration-deferred-20260815" "ce0fa4899a9498d7795d4da9b5f96ba3570c3ead"

          git push origin \
            refs/tags/archive/engineering-native-language-feasibility-20260814 \
            refs/tags/archive/research-csomi-source-20260814 \
            refs/tags/archive/research-slsh-terminal-20260814 \
            refs/tags/archive/promotion-csomi-selective-canonical-deferred-20260814 \
            refs/tags/archive/promotion-csomi-slsh-integration-deferred-20260815

          test "$(git ls-remote origin refs/tags/archive/engineering-native-language-feasibility-20260814 | cut -f1)" = "3dfc21463502e1c32189ae167d92f163ca1a55e8"
          test "$(git ls-remote origin refs/tags/archive/research-csomi-source-20260814 | cut -f1)" = "87405c1877c6f016c303971da13923a1ab690aae"
          test "$(git ls-remote origin refs/tags/archive/research-slsh-terminal-20260814 | cut -f1)" = "893d8dc0c1c9d8f9a4188860520143c8d1d3977b"
          test "$(git ls-remote origin refs/tags/archive/promotion-csomi-selective-canonical-deferred-20260814 | cut -f1)" = "7c48c0de87514088c3fd1410218ae92231be0887"
          test "$(git ls-remote origin refs/tags/archive/promotion-csomi-slsh-integration-deferred-20260815 | cut -f1)" = "ce0fa4899a9498d7795d4da9b5f96ba3570c3ead"

          git push origin --delete \
            engineering/aion-native-language-feasibility-20260814 \
            research/cross-substrate-other-minds-inference-20260814 \
            frozen/slsh-semantic-reconciliation-20260814 \
            promotion/csomi-selective-canonical-20260814 \
            promotion/csomi-slsh-integration-selective-20260815

          for ref in \
            engineering/aion-native-language-feasibility-20260814 \
            research/cross-substrate-other-minds-inference-20260814 \
            frozen/slsh-semantic-reconciliation-20260814 \
            promotion/csomi-selective-canonical-20260814 \
            promotion/csomi-slsh-integration-selective-20260815
          do
            test -z "$(git ls-remote origin "refs/heads/${ref}")"
          done

          check_head "main" "748d7c935c045c5fe92a22d372b93151a9a5e6ef"
          check_head "review/four-domain-research-materialization" "$GITHUB_SHA"
