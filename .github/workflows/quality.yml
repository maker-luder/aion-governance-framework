name: Quality

on:
  push:
    branches:
      - main
      - feat/**
      - review/aion-astra-whole-system-completion-v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test runner and declared external test dependency
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e examples/bazi-capability_v0.1.1

      - name: Scan public tree for prohibited artifacts and obvious secrets
        run: python scripts/scan_public_tree.py

      - name: Compile public Python sources
        run: python -m compileall -q components examples research-labs scripts

      - name: Run component test suites
        run: python scripts/run_component_tests.py

  frozen-release-verification:
    name: Frozen v0.1.0-rc.1 manifest verification
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen v0.1.0-rc.1 release
        uses: actions/checkout@v4
        with:
          ref: v0.1.0-rc.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen public release manifest
        run: python scripts/verify_release.py
