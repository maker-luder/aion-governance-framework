name: Quality

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Compile public Python sources
        run: python -m compileall -q components examples research-labs scripts

      - name: Verify public-package safety boundary
        run: python scripts/verify_release.py

      - name: Run component test suites
        run: python scripts/run_component_tests.py
