name: Quality

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test runner and declared external test dependency
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e examples/bazi-capability_v0.1.1

      - name: Scan public tree for prohibited artifacts and obvious secrets
        run: python scripts/scan_public_tree.py

      - name: Verify current checkout against exact Git HEAD tree
        run: python scripts/verify_release.py --baseline current-head

      - name: Run release-tooling negative tests
        run: python -m pytest -q tests/test_release_tooling.py

      - name: Compile public Python sources
        run: python -m compileall -q components examples research-labs scripts experiments

      - name: Run component test suites
        run: python scripts/run_component_tests.py

      - name: Run minimal Recall Gate contrast experiment
        run: python experiments/g1-recall-gate-baseline_v0.1.0/run_experiment.py

  historical-self-verification:
    name: Historical self-verification from v0.1.0-rc.1
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen v0.1.0-rc.1 release
        uses: actions/checkout@v4
        with:
          ref: v0.1.0-rc.1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen public release manifest
        run: python scripts/verify_release.py

  current-historical-revalidation:
    name: Current controls revalidate pinned v0.1.0-rc.1 evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository with historical tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Revalidate pinned historical evidence with current verifier
        run: python scripts/verify_release.py --baseline historical-rc
