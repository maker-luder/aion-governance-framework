name: Research Scope Lock

on:
  push:
    branches:
      - review/four-domain-research-materialization
    paths:
      - ".github/workflows/research-scope-lock.yml"
      - "scripts/check_research_scope_lock.py"
      - "scripts/check_autonomous_growth_contract.py"
      - "AUTONOMOUS_RESEARCH_GROWTH.md"
      - "research-workbench/autonomous-growth/**"
      - "research-workbench/four-domain-materialization/2026-08-12/AUTONOMOUS_RESEARCH_GROWTH_CHARTER_2026-08-12.md"
      - "research-workbench/four-domain-materialization/2026-08-10/RESEARCH_BRANCH_FREE_GROWTH_CHARTER.md"
      - "research-workbench/four-domain-materialization/2026-08-11/RESEARCH_SCOPE_LOCK_2026-08-11.json"
      - "research-workbench/four-domain-materialization/2026-08-11/RESEARCH_SCOPE_DRIFT_CORRECTION_2026-08-11.md"
      - "components/aion_runtime_v0.2.0/**"
      - "research-labs/**"
  pull_request:
    branches:
      - main
      - review/four-domain-research-materialization
    paths:
      - ".github/workflows/research-scope-lock.yml"
      - "scripts/check_research_scope_lock.py"
      - "scripts/check_autonomous_growth_contract.py"
      - "AUTONOMOUS_RESEARCH_GROWTH.md"
      - "research-workbench/autonomous-growth/**"
      - "research-workbench/four-domain-materialization/2026-08-12/AUTONOMOUS_RESEARCH_GROWTH_CHARTER_2026-08-12.md"
      - "research-workbench/four-domain-materialization/2026-08-10/RESEARCH_BRANCH_FREE_GROWTH_CHARTER.md"
      - "research-workbench/four-domain-materialization/2026-08-11/RESEARCH_SCOPE_LOCK_2026-08-11.json"
      - "components/aion_runtime_v0.2.0/**"
      - "research-labs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-scope-lock:
    name: Artificial-subjectivity research scope lock
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Verify research scope invariants
        run: python scripts/check_research_scope_lock.py

      - name: Verify autonomous growth contract
        run: python scripts/check_autonomous_growth_contract.py
